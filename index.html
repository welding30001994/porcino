<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Señales de Trading</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }

  body {
    min-height:100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    padding:20px;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1 {
    text-align:center;
    font-size:1.6rem;
    margin-bottom:20px;
    background: linear-gradient(90deg,#00f5a0,#00d9f5);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    font-weight:800;
  }

  .container {
    width:100%;
    max-width:480px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;
    padding:24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    margin-bottom:30px;
  }

  .image-box {
    width:100%;
    height:150px;
    border:2px dashed rgba(255,255,255,0.3);
    border-radius:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    overflow:hidden;
    margin-bottom:10px;
    transition:0.3s;
    background:rgba(0,0,0,0.2);
  }

  .image-box:hover { border-color:#00f5a0; }

  .image-box img { width:100%; height:100%; object-fit:cover; display:none; }
  .image-box span { color:#aaa; font-size:0.9rem; text-align:center; padding:10px; }

  .img-info {
    font-size:0.75rem;
    color:#00f5a0;
    text-align:center;
    margin-bottom:15px;
    min-height:16px;
  }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .field { display:flex; flex-direction:column; gap:6px; }

  .field label {
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#00f5a0;
    font-weight:700;
  }

  .field input {
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(0,0,0,0.3);
    color:#fff;
    font-size:1rem;
    outline:none;
    transition:0.3s;
  }

  .field input:focus {
    border-color:#00f5a0;
    box-shadow:0 0 0 3px rgba(0,245,160,0.2);
  }

  .full { grid-column: span 2; }

  .buttons { display:flex; gap:10px; margin-top:10px; }

  button {
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
  }

  .save { background: linear-gradient(90deg,#00f5a0,#00d9f5); color:#000; }
  .save:hover { transform:translateY(-2px); box-shadow:0 10px 25px rgba(0,245,160,0.4); }

  .clear { background: rgba(255,80,80,0.2); color:#ff6b6b; border:1px solid rgba(255,80,80,0.4); }
  .clear:hover { background: rgba(255,80,80,0.35); }

  .status { text-align:center; font-size:0.8rem; margin-top:8px; color:#00f5a0; min-height:18px; }

  /* HISTORIAL */
  .history-title {
    width:100%;
    max-width:480px;
    font-size:1.1rem;
    color:#00f5a0;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .history-title span { font-size:0.8rem; color:#aaa; font-weight:400; }

  .history {
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:18px;
    overflow:hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(10px); }
    to { opacity:1; transform:translateY(0); }
  }

  .card-img {
    width:100%;
    height:180px;
    object-fit:cover;
    display:block;
    background:#111;
  }

  .card-body { padding:14px 16px 16px; }

  .card-date {
    font-size:0.72rem;
    color:#00d9f5;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .card-date .badge {
    background:rgba(0,245,160,0.15);
    color:#00f5a0;
    padding:2px 8px;
    border-radius:20px;
    font-size:0.65rem;
  }

  .card-row {
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-size:0.92rem;
  }
  .card-row:last-child { border:none; }

  .card-row .tag { font-weight:700; color:#ccc; }
  .card-row .sl { color:#ff6b6b; font-weight:700; }
  .card-row .tp { color:#00f5a0; font-weight:700; }
  .card-row .entry { color:#fff; font-weight:700; }

  .delete-btn {
    width:100%;
    margin-top:10px;
    padding:8px;
    border:none;
    border-radius:10px;
    background: rgba(255,80,80,0.15);
    color:#ff6b6b;
    font-size:0.8rem;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
  }
  .delete-btn:hover { background: rgba(255,80,80,0.35); }

  .empty {
    width:100%;
    max-width:480px;
    text-align:center;
    color:#666;
    padding:30px;
    font-size:0.9rem;
  }
</style>
</head>
<body>

<h1>📊 Mis Señales de Trading</h1>

<!-- FORMULARIO -->
<div class="container">
  <div class="image-box" id="imageBox" onclick="document.getElementById('fileInput').click()">
    <img id="previewImg" alt="preview">
    <span id="imageText">📷 Toca para subir una imagen</span>
  </div>
  <div class="img-info" id="imgInfo"></div>
  <input type="file" id="fileInput" accept="image/*" hidden>

  <div class="grid">
    <div class="field full">
      <label>Precio de Entrada</label>
      <input type="number" step="any" id="entry" placeholder="Ej: 1.2345">
    </div>
    <div class="field"><label>SL</label><input type="number" step="any" id="sl" placeholder="Stop Loss"></div>
    <div class="field"><label>TP1</label><input type="number" step="any" id="tp1" placeholder="TP1"></div>
    <div class="field"><label>TP2</label><input type="number" step="any" id="tp2" placeholder="TP2"></div>
    <div class="field"><label>TP3</label><input type="number" step="any" id="tp3" placeholder="TP3"></div>
  </div>

  <div class="buttons">
    <button class="save" onclick="saveSignal()">🚀 Compartir Señal</button>
    <button class="clear" onclick="resetForm()">🧹 Limpiar</button>
  </div>

  <div class="status" id="status"></div>
</div>

<!-- HISTORIAL -->
<div class="history-title">
  📁 Historial de señales <span id="count">0</span>
</div>
<div class="history" id="history">
  <div class="empty" id="emptyMsg">Aún no has compartido ninguna señal 😴</div>
</div>

<script>
  /* ============================================================
     INDEXEDDB
     ============================================================ */
  const DB_NAME = 'TradeSignalsDB';
  const STORE = 'signals';
  let db;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains(STORE)) {
          database.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = e => { db = e.target.result; resolve(db); };
      req.onerror = e => reject(e.target.error);
    });
  }

  function dbAdd(data) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).add(data);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function dbGetAll() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function dbDelete(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  /* ============================================================
     COMPRESIÓN DE IMAGEN
     ============================================================ */
  function compressImage(file, maxWidth = 1200, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function formatDate(iso) {
    const d = new Date(iso);
    const fecha = d.toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });
    const hora  = d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    return { fecha, hora };
  }

  /* ============================================================
     ELEMENTOS
     ============================================================ */
  const fileInput = document.getElementById('fileInput');
  const previewImg = document.getElementById('previewImg');
  const imageText = document.getElementById('imageText');
  const statusEl = document.getElementById('status');
  const imgInfo = document.getElementById('imgInfo');
  const historyEl = document.getElementById('history');
  const emptyMsg = document.getElementById('emptyMsg');
  const countEl = document.getElementById('count');

  let currentImageData = '';

  /* ============================================================
     INICIALIZAR
     ============================================================ */
  window.addEventListener('DOMContentLoaded', async () => {
    await openDB();
    await renderHistory();
  });

  /* ============================================================
     SUBIR IMAGEN + COMPRIMIR
     ============================================================ */
  fileInput.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;

    const originalSize = file.size;
    imgInfo.textContent = '⏳ Comprimiendo imagen...';

    try {
      const compressed = await compressImage(file, 1200, 0.75);
      currentImageData = compressed;
      previewImg.src = compressed;
      previewImg.style.display = 'block';
      imageText.style.display = 'none';

      const approxBytes = Math.round((compressed.length * 3) / 4);
      imgInfo.textContent = `✅ Original: ${formatBytes(originalSize)} → Comprimida: ~${formatBytes(approxBytes)}`;
    } catch (err) {
      imgInfo.textContent = '❌ Error al comprimir la imagen';
      console.error(err);
    }
  });

  /* ============================================================
     GUARDAR / COMPARTIR SEÑAL
     ============================================================ */
  async function saveSignal() {
    const entry = document.getElementById('entry').value.trim();
    const sl = document.getElementById('sl').value.trim();
    const tp1 = document.getElementById('tp1').value.trim();
    const tp2 = document.getElementById('tp2').value.trim();
    const tp3 = document.getElementById('tp3').value.trim();

    if (!currentImageData && !entry) {
      statusEl.textContent = '⚠️ Sube una imagen o pon al menos la entrada';
      setTimeout(() => statusEl.textContent = '', 2500);
      return;
    }

    const now = new Date().toISOString();

    const signal = {
      image: currentImageData || '',
      entry, sl, tp1, tp2, tp3,
      createdAt: now
    };

    await dbAdd(signal);
    statusEl.textContent = '✅ Señal compartida y guardada';
    setTimeout(() => statusEl.textContent = '', 2500);

    resetForm();
    await renderHistory();
  }

  /* ============================================================
     RESET FORMULARIO
     ============================================================ */
  function resetForm() {
    currentImageData = '';
    fileInput.value = '';
    previewImg.src = '';
    previewImg.style.display = 'none';
    imageText.style.display = 'block';
    imgInfo.textContent = '';
    ['entry','sl','tp1','tp2','tp3'].forEach(id => document.getElementById(id).value = '');
  }

  /* ============================================================
     RENDER HISTORIAL
     ============================================================ */
  async function renderHistory() {
    const all = await dbGetAll();
    // más recientes primero
    all.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    historyEl.innerHTML = '';
    countEl.textContent = all.length + ' señal' + (all.length === 1 ? '' : 'es');

    if (all.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Aún no has compartido ninguna señal 😴';
      historyEl.appendChild(empty);
      return;
    }

    all.forEach(sig => {
      const { fecha, hora } = formatDate(sig.createdAt);

      const card = document.createElement('div');
      card.className = 'card';

      let imgHtml = '';
      if (sig.image) {
        imgHtml = `<img class="card-img" src="${sig.image}" alt="señal">`;
      }

      card.innerHTML = `
        ${imgHtml}
        <div class="card-body">
          <div class="card-date">
            <span>📅 ${fecha} · 🕒 ${hora}</span>
            <span class="badge">#${sig.id}</span>
          </div>
          <div class="card-row"><span class="tag">Entrada</span><span class="entry">${sig.entry || '-'}</span></div>
          <div class="card-row"><span class="tag">SL</span><span class="sl">${sig.sl || '-'}</span></div>
          <div class="card-row"><span class="tag">TP1</span><span class="tp">${sig.tp1 || '-'}</span></div>
          <div class="card-row"><span class="tag">TP2</span><span class="tp">${sig.tp2 || '-'}</span></div>
          <div class="card-row"><span class="tag">TP3</span><span class="tp">${sig.tp3 || '-'}</span></div>
          <button class="delete-btn" onclick="removeSignal(${sig.id})">🗑 Eliminar esta señal</button>
        </div>
      `;
      historyEl.appendChild(card);
    });
  }

  /* ============================================================
     ELIMINAR SEÑAL
     ============================================================ */
  async function removeSignal(id) {
    if (!confirm('¿Eliminar esta señal del historial?')) return;
    await dbDelete(id);
    await renderHistory();
  }
</script>

</body>
</html>
